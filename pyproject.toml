[project]
name = "urlpeek"
version = "0.1.0"
description = "Preview what's at a URL before opening it in a real browser"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "rich>=13.0",
]

[project.scripts]
urlpeek = "urlpeek.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["urlpeek"]
