[project]
name = "drivefind"
version = "0.1.0"
description = "AI-powered semantic search over your Google Drive"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.scripts]
drivefind = "drivefind.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["drivefind"]

[tool.setuptools.package-data]
drivefind = ["static/*.html"]
