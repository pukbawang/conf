<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>drivefind</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #index-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
  #search-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  #search-row input { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 0.9rem; cursor: pointer; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 0.9rem; margin-bottom: 0.8rem; }
  .card h3 { margin: 0 0 0.2rem; font-size: 1rem; }
  .meta { font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.4rem; }
  .tags span { display: inline-block; background: #8882; border-radius: 10px; padding: 0.1rem 0.6rem; margin: 0.1rem 0.2rem 0.1rem 0; font-size: 0.75rem; }
  .actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
  .edit-fields { display: none; margin-top: 0.5rem; }
  .edit-fields.open { display: block; }
  .edit-fields input, .edit-fields textarea { width: 100%; margin-bottom: 0.4rem; padding: 0.35rem; box-sizing: border-box; }
  #status { font-size: 0.85rem; opacity: 0.8; }
</style>
</head>
<body>
  <h1>drivefind</h1>
  <p>Semantic search over your Google Drive.</p>

  <div id="index-row">
    <button id="index-btn">Re-index Drive</button>
    <span id="status"></span>
  </div>

  <div id="search-row">
    <input id="search-input" placeholder="Describe what you're looking for…" />
    <button id="search-btn">Search</button>
  </div>

  <div id="results"></div>

<script>
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

document.getElementById('index-btn').addEventListener('click', async () => {
  statusEl.textContent = 'Indexing… this can take a while on first run.';
  try {
    const resp = await fetch('/api/index', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Index failed');
    let note = `Indexed ${data.indexed}, skipped ${data.skipped_unchanged} unchanged, failed ${data.failed} (of ${data.scanned} scanned).`;
    if (data.using_fake_ai) note += ' [no ANTHROPIC_API_KEY — using placeholder records]';
    if (data.using_fake_embeddings) note += ' [no VOYAGE_API_KEY — using placeholder embeddings]';
    statusEl.textContent = note;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  }
});

async function runSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  resultsEl.innerHTML = '<p>Searching…</p>';
  try {
    const resp = await fetch('/api/search?q=' + encodeURIComponent(q));
    const results = await resp.json();
    if (!resp.ok) throw new Error(results.detail || 'Search failed');
    renderResults(results);
  } catch (err) {
    resultsEl.innerHTML = '<p>Error: ' + err.message + '</p>';
  }
}

document.getElementById('search-btn').addEventListener('click', runSearch);
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runSearch();
});

function renderResults(results) {
  if (results.length === 0) {
    resultsEl.innerHTML = '<p>No results. Try re-indexing first.</p>';
    return;
  }
  resultsEl.innerHTML = '';
  for (const r of results) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${escapeHtml(r.name)}</h3>
      <div class="meta">${escapeHtml(r.mime_type)} · score ${r.score.toFixed(3)}</div>
      <div><em>${escapeHtml(r.subtitle || '')}</em></div>
      <p>${escapeHtml(r.description || '')}</p>
      <div class="tags">${(r.tags || []).map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
      <div class="actions">
        <button data-action="download">Download</button>
        <button data-action="edit">Edit</button>
        ${r.web_view_link ? `<a href="${r.web_view_link}" target="_blank">Open in Drive</a>` : ''}
      </div>
      <div class="edit-fields">
        <label>Subtitle</label>
        <input data-field="subtitle" value="${escapeHtml(r.subtitle || '')}" />
        <label>Description</label>
        <textarea data-field="description" rows="3">${escapeHtml(r.description || '')}</textarea>
        <label>Tags (comma separated)</label>
        <input data-field="tags" value="${escapeHtml((r.tags || []).join(', '))}" />
        <button data-action="save">Save</button>
      </div>
    `;
    card.querySelector('[data-action="download"]').addEventListener('click', () => {
      window.location.href = '/api/download/' + encodeURIComponent(r.id);
    });
    card.querySelector('[data-action="edit"]').addEventListener('click', () => {
      card.querySelector('.edit-fields').classList.toggle('open');
    });
    card.querySelector('[data-action="save"]').addEventListener('click', async () => {
      const subtitle = card.querySelector('[data-field="subtitle"]').value;
      const description = card.querySelector('[data-field="description"]').value;
      const tags = card.querySelector('[data-field="tags"]').value.split(',').map(t => t.trim()).filter(Boolean);
      const resp = await fetch('/api/files/' + encodeURIComponent(r.id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subtitle, description, tags }),
      });
      if (resp.ok) {
        card.querySelector('.edit-fields').classList.remove('open');
      } else {
        alert('Save failed');
      }
    });
    resultsEl.appendChild(card);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
